name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # The module has no third-party dependencies (no go.sum), so there is nothing to cache.
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverpkg=./internal/...,./pkg/... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm run test:coverage

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t retro-calculator .

      - name: Smoke test the container
        run: |
          docker run -d --name calc -p 8080:8080 retro-calculator

          # Wait for Docker's own HEALTHCHECK (the binary's `healthcheck` mode).
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' calc)
            [ "$status" = healthy ] && break
            sleep 1
          done
          echo "health: $status"
          [ "$status" = healthy ]

          # The frontend is served...
          curl -fsS http://localhost:8080/ | grep -q '<title>Retro Calculator</title>'
          # ...and the API answers next to it.
          curl -fsS -X POST http://localhost:8080/api/v1/divide -d '{"a":100,"b":3}' \
            | grep -q '"result":33.3333333333333'

      - name: Container logs
        if: always()
        run: docker logs calc || true
